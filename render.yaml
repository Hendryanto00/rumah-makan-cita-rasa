services:
  - type: web
    name: rumah-makan-cita-rasa
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: stack
      # Tambahkan env vars lainnya di Render.com dashboard
      # APP_KEY, DB_*, dll

